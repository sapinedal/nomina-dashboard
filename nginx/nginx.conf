worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

# Perfil por defecto: nginx sirve HTTP en el puerto 80 de la red interna y el
# TLS lo termina el proxy de la plataforma (Traefik en Dokploy), que además
# emite y renueva el certificado. Por eso este contenedor NO publica puertos
# del host: el 80 y el 443 pertenecen a ese proxy y reclamarlos aborta el
# despliegue con "port is already allocated".
#
# Para un host sin terminador TLS delante, usar nginx.standalone-tls.conf.
http {
    # DEF-0006 / hardening. Va dentro de http: nginx rechaza el arranque si
    # server_tokens aparece en el contexto principal.
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # El esquema real lo conoce el proxy, no nginx: aquí $scheme siempre es
    # http, así que HSTS se decide con la cabecera reenviada (DEF-0004).
    map $http_x_forwarded_proto $hsts_header {
        https "max-age=31536000; includeSubDomains";
        default "";
    }

    server {
        listen 80;
        server_name nomina.clinicavictoriana.com _;
        client_max_body_size 50M;

        # DEF-0004
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        root /usr/share/nginx/html;
        index login.html;

        location / {
            try_files $uri $uri/ /login.html;
        }

        location /api/ {
            proxy_pass         http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health {
            proxy_pass http://backend:8000/health;
        }

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~* \.(ico|png|jpg|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
