worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        # ── Frontend estático ─────────────────────────────────
        root /usr/share/nginx/html;
        index login.html;

        location / {
            try_files $uri $uri/ /login.html;
        }

        # ── Proxy al Backend API ──────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health {
            proxy_pass http://backend:8000/health;
        }

        # ── Cache de activos estáticos ────────────────────────
        # HTML nunca se cachea agresivo (cada deploy debe verse al instante).
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # JS/CSS: cache corto + revalidación. NO usar "immutable" — impide
        # que el navegador tome el archivo nuevo tras un redeploy (el bug de
        # tasa 7050% quedó visible por esto aunque el backend ya estaba fijo).
        location ~* \.(css|js)$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location ~* \.(ico|png|jpg|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
