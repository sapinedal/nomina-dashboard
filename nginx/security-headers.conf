# DEF-0004 — cabeceras de endurecimiento, en un solo sitio.
#
# nginx NO hereda add_header por acumulacion: las directivas de un nivel se
# heredan "si y solo si NO hay ninguna add_header definida en el nivel
# actual". Un location que anade su propia cabecera de cache descarta, sin
# avisar, TODAS las del server: CSP, X-Frame-Options, HSTS, Referrer-Policy y
# Permissions-Policy.
#
# Por eso este fragmento se incluye en el server Y dentro de cada location que
# define cabeceras propias. Si anades un location con add_header, incluyelo
# tambien ahi o esas respuestas saldran sin endurecer.
#
# $hsts_header lo define un map distinto en cada perfil: por $scheme en el
# standalone con TLS propio, y por $http_x_forwarded_proto cuando hay un
# terminador TLS delante.
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
