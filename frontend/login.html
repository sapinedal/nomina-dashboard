<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NóminaBoard — Iniciar Sesión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="login-bg">

  <div class="login-card">
    <div style="text-align:center;margin-bottom:24px">
      <div class="brand-icon">📊</div>
      <h1>NóminaBoard</h1>
      <p class="tagline">Dashboard de Novedades de Nómina · Sumimedical</p>
    </div>

    <div class="alert-error" id="alert-box" role="alert" style="display:none">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="alert-msg"></span>
    </div>

    <form id="login-form">
      <div class="form-field">
        <label for="username">Usuario</label>
        <div class="input-wrap">
          <i class="bi bi-person"></i>
          <input type="text" id="username" name="username" placeholder="nombre.usuario" autocomplete="username" required minlength="1" />
        </div>
      </div>
      <div class="form-field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="bi bi-lock"></i>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required minlength="1" />
          <button type="button" class="btn-pw-toggle" id="toggle-pw" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-submit">
        <span id="btn-text"><i class="bi bi-box-arrow-in-right"></i> Ingresar</span>
        <span id="btn-spin" style="display:none">
          <span class="spinner" style="border-color:rgba(255,255,255,.3);border-top-color:#fff;width:16px;height:16px;border-width:2px"></span>
          Verificando...
        </span>
      </button>
    </form>

    <p style="text-align:center;font-size:.75rem;color:var(--muted);margin-top:24px;margin-bottom:0">
      <i class="bi bi-shield-lock me-1"></i> Acceso restringido al personal autorizado
    </p>
  </div>

  <script src="js/api.js?v=20260826e"></script>
  <script>
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      const icon = document.querySelector('#toggle-pw i');
      if (pw.type === 'password') { pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
    });

    function resetLoginButton() {
      document.getElementById('btn-text').style.display = 'flex';
      document.getElementById('btn-spin').style.display = 'none';
    }

    function showLoginError(msg) {
      const alertBox = document.getElementById('alert-box');
      document.getElementById('alert-msg').textContent = msg;
      alertBox.style.display = 'flex';
      resetLoginButton();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const alertBox = document.getElementById('alert-box');
      alertBox.style.display = 'none';

      // DEF-0005: validación cliente antes de llamar API
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        showLoginError('Usuario y contraseña son obligatorios');
        return;
      }

      document.getElementById('btn-text').style.display = 'none';
      document.getElementById('btn-spin').style.display = 'flex';

      try {
        const data = await API.login(username, password);
        storeSession({ expires_in: data.expires_in, user: data.user });
        window.location.href = 'dashboard.html';
      } catch (err) {
        showLoginError(err.message || 'Usuario o contraseña incorrectos');
      }
    });

    API.me().then(() => { window.location.href = 'dashboard.html'; }).catch(() => {});
  </script>
</body>
</html>
